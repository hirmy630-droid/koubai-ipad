<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>勾配 寸法計算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* iOS Dark Mode Theme */
        body {
            background-color: #000000;
            color: #ffffff;
            font-size: 0.9375rem; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* 左右2列レイアウトの確実な維持 */
        .ipad-split-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr);
            gap: 14px;
            align-items: start;
            width: 100%;
        }
        .calc-column, .table-column {
            min-width: 0;
        }
        .table-column {
            position: sticky;
            top: 10px;
        }
        .table-card {
            max-height: calc(100vh - 70px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            overflow-y: auto;
        }

        /* 一体型コンテナ */
        .unified-input-unit {
            background: #1c1c1e;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #333;
        }

        /* 入力セルセクション */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #000;
        }
        .input-cell {
            border-bottom: 1px solid #333;
            border-right: 1px solid #333;
            padding: 4px 10px;
            height: 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: #000;
            cursor: pointer;
        }
        .input-cell:nth-child(2n) {
            border-right: none;
        }
        .input-cell.active {
            outline: 2px solid #ff9f0a;
            outline-offset: -2px;
            z-index: 20;
            background: #1c1c1e;
        }
        .cell-label {
            font-size: 13px !important;
            color: #8e8e93;
            font-weight: 600;
            margin-bottom: 0px;
        }
        .cell-value {
            font-size: 1.6rem; 
            font-weight: 700;
            text-align: right;
            padding-right: 4px;
            line-height: 1.1;
        }

        /* テンキー（ご指定の2行構成） */
        .keypad-container {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: #333;
        }
        .keypad-row {
            display: grid;
            gap: 1px;
            background: #333;
        }
        .row-top {
            grid-template-columns: repeat(3, 1fr);
        }
        .row-bottom {
            grid-template-columns: repeat(11, 1fr);
        }
        .key-btn {
            background: #1c1c1e;
            color: #ffffff;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 500;
            transition: background 0.1s, transform 0.05s;
            border: none;
            outline: none;
            padding: 0;
            cursor: pointer;
        }
        .key-btn:active {
            background: #333336;
            transform: scale(0.98);
        }
        .key-fn {
            height: 46px;
            font-size: 15px;
            font-weight: 600;
        }
        .key-fn.clear-btn {
            background: #262628;
            color: #d1d1d6;
        }
        .key-fn.clear-btn:active {
            background: #363638;
        }
        .key-fn.enter-btn {
            background: #2c2217;
            color: #ff9f0a;
            border: 1px solid rgba(255, 159, 10, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .key-fn.enter-btn:active {
            background: #3d2e1c;
        }

        .result-label {
            font-size: 13px !important;
            font-weight: 700;
        }

        .result-value {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .canvas-container {
            background-color: #000;
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }
        
        .result-table th {
            border: 0.5px solid #333; 
            text-align: center; 
            padding: 10px 2px !important;
            font-size: 14px;
        }
        
        .result-table td {
            border: 0.5px solid #333; 
            text-align: center; 
            padding: 12px 2px !important;
            font-size: 1.15rem;
        }

        #shareBtn {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: #0a84ff;
            color: #fff;
            padding: 8px 14px;
            font-size: 15px;
            font-weight: 800;
            line-height: 1;
            min-height: 34px;
            box-shadow: 0 6px 14px rgba(10,132,255,.20);
            cursor: pointer;
        }
        #shareBtn:active { transform: scale(.99); background: #0974dd; }
        
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(59, 130, 246, 0.95);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            opacity: 0;
            z-index: 10000;
            transition: 0.3s;
            pointer-events: none;
        }
        #toast.show { opacity: 1; }

        #installBtn {
            position: fixed;
            right: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom));
            z-index: 9999;
            border: none;
            border-radius: 14px;
            background: #2563eb;
            color: #fff;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(0,0,0,.35);
            display: none;
        }
        #installBtn:active { transform: scale(.98); }
    </style>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="勾配 寸法計算">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-180.png">
</head>
<body class="p-3 relative">
    <div id="toast">コピーしました</div>

    <div id="app-container" class="mx-auto min-h-screen pb-4 max-w-[1400px]">
        <header class="flex items-baseline justify-between py-1 px-1 mb-2 gap-2">
            <h1 class="text-[20px] font-bold text-white tracking-tight">勾配 寸法計算</h1>
            <div class="flex items-center gap-3">
                <button id="shareBtn" type="button" onclick="shareAllData()">共有</button>
                <p class="text-xs text-gray-400 font-semibold whitespace-nowrap">KYOWA ROOF</p>
            </div>
        </header>

        <!-- 左右2列レイアウト（固定保持） -->
        <div class="ipad-split-layout">
            <!-- 左列：入力・テンキー・計算結果・図面 -->
            <div class="calc-column">
                <div class="unified-input-unit mb-3">
                    <div class="input-grid">
                        <div id="cell-L1" class="input-cell active" onclick="setActiveCell('L1')">
                            <span class="cell-label text-[#30d158]">基準側 L1</span>
                            <span id="val-L1" class="cell-value text-[#30d158]">0</span>
                        </div>
                        <div id="cell-L2" class="input-cell" onclick="setActiveCell('L2')">
                            <span class="cell-label text-[#30d158]">延長側 L2</span>
                            <span id="val-L2" class="cell-value text-[#30d158]">0</span>
                        </div>
                        <div id="cell-W" class="input-cell" onclick="setActiveCell('W')">
                            <span class="cell-label text-[#0a84ff]">全体の幅 W</span>
                            <span id="val-W" class="cell-value text-[#0a84ff]">0</span>
                        </div>
                        <div id="cell-Pitch" class="input-cell" onclick="setActiveCell('Pitch')">
                            <span class="cell-label text-[#bf5af2]">働き幅 ＠</span>
                            <span id="val-Pitch" class="cell-value text-[#bf5af2]">0</span>
                        </div>
                    </div>

                    <!-- テンキー（2行構成: 上段3キー均等幅 / 下段11キー） -->
                    <div class="keypad-container">
                        <div class="keypad-row row-top">
                            <button type="button" class="key-btn key-fn clear-btn" onclick="pressKey('C')">C</button>
                            <button type="button" class="key-btn key-fn clear-btn" onclick="pressKey('AC')">AC</button>
                            <button type="button" class="key-btn key-fn enter-btn" onclick="pressKey('enter')">
                                <span>エンター</span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>
                            </button>
                        </div>
                        <div class="keypad-row row-bottom">
                            <button type="button" class="key-btn" onclick="pressKey('1')">1</button>
                            <button type="button" class="key-btn" onclick="pressKey('2')">2</button>
                            <button type="button" class="key-btn" onclick="pressKey('3')">3</button>
                            <button type="button" class="key-btn" onclick="pressKey('4')">4</button>
                            <button type="button" class="key-btn" onclick="pressKey('5')">5</button>
                            <button type="button" class="key-btn" onclick="pressKey('6')">6</button>
                            <button type="button" class="key-btn" onclick="pressKey('7')">7</button>
                            <button type="button" class="key-btn" onclick="pressKey('8')">8</button>
                            <button type="button" class="key-btn" onclick="pressKey('9')">9</button>
                            <button type="button" class="key-btn" onclick="pressKey('0')">0</button>
                            <button type="button" class="key-btn" onclick="pressKey('00')">00</button>
                        </div>
                    </div>
                </div>

                <div class="bg-[#1c1c1e] rounded-[14px] p-3 border border-[#333]">
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div class="bg-black border border-[#333] p-1.5 rounded-lg text-center">
                            <span class="block result-label text-[#0a84ff]">延長後の幅</span>
                            <span id="resNewB" class="result-value text-white">-</span>
                        </div>
                        <div class="bg-black border border-[#333] p-1.5 rounded-lg text-center">
                            <span class="block result-label text-[#30d158]">延長後のL2</span>
                            <span id="resNewC" class="result-value text-white">-</span>
                        </div>
                        <div class="bg-black border border-[#333] p-1.5 rounded-lg text-center">
                            <span class="block result-label text-[#ff9f0a]">総枚数</span>
                            <span id="resIntervalCount" class="result-value text-white">-</span>
                        </div>
                        <div class="bg-black border border-[#333] p-1.5 rounded-lg text-center">
                            <span class="block result-label text-[#bf5af2]">増分</span>
                            <span id="resStep" class="result-value text-white">-</span>
                        </div>
                    </div>

                    <div class="canvas-container border border-[#333] rounded-lg cursor-pointer" onclick="openZoomModal()">
                        <canvas id="slopeCanvas"></canvas>
                    </div>
                </div>
            </div>

            <!-- 右列：寸法詳細テーブル -->
            <div class="table-column">
                <div class="bg-[#1c1c1e] rounded-[14px] p-3 border border-[#333] table-card">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="font-bold text-gray-200">寸法詳細</h2>
                        <span id="table-summary" class="text-lg text-[#ff9f0a] font-bold"></span>
                    </div>
                    <table class="result-table w-full border-collapse bg-black text-sm">
                        <thead>
                            <tr>
                                <th class="w-[20%] text-[#ff9f0a] bg-[#1c1c1e] py-2" style="border-bottom: 1px solid #d1d1d6;">No.</th>
                                <th class="w-[40%] text-[#0a84ff] bg-[#1c1c1e] py-2" style="border-bottom: 1px solid #d1d1d6;">働き幅</th>
                                <th class="w-[40%] text-[#30d158] bg-[#1c1c1e] py-2" style="border-bottom: 1px solid #d1d1d6;">長さ</th>
                            </tr>
                        </thead>
                        <tbody id="resultBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 拡大モーダル -->
    <div id="zoomModal" class="hidden fixed inset-0 z-[10000] flex flex-col bg-black transition-opacity">
        <div class="absolute top-0 left-0 right-0 p-4 md:p-6 flex justify-end items-center z-[10010]">
            <div class="flex gap-3">
                <button type="button" class="text-white bg-white/20 hover:bg-white/30 rounded-full p-2.5 backdrop-blur-md transition-colors" onclick="toggleZoomRotation()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                </button>
                <button type="button" class="text-white bg-white/20 hover:bg-white/30 rounded-full p-2.5 backdrop-blur-md transition-colors" onclick="closeZoomModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
        </div>
        <div id="zoomArea" class="flex-1 w-full h-full flex items-center justify-center overflow-hidden touch-none relative">
            <img id="zoomImg" class="max-w-full max-h-full object-contain transition-transform duration-75 ease-out" alt="拡大図面" style="transform-origin: center;">
        </div>
    </div>

    <script>
        let activeKey = 'L1';
        let values = { L1: '0', L2: '0', W: '0', Pitch: '0' };
        let isFirstInput = true;
        const sequence = ['L1', 'L2', 'W', 'Pitch'];

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (t) {
                t.innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 1200);
            }
        }

        function setActiveCell(key) {
            activeKey = key;
            isFirstInput = true; 
            sequence.forEach(k => {
                const cell = document.getElementById(`cell-${k}`);
                if(cell) cell.classList.remove('active');
            });
            const activeCell = document.getElementById(`cell-${key}`);
            if(activeCell) activeCell.classList.add('active');
        }

        function pressKey(key) {
            let cur = values[activeKey];
            if (key === 'AC') {
                values = { L1: '0', L2: '0', W: '0', Pitch: '0' };
                isFirstInput = true;
                showToast("全クリアしました");
            } else if (key === 'C') {
                values[activeKey] = '0';
                isFirstInput = true;
            } else if (key === 'enter') {
                const idx = sequence.indexOf(activeKey);
                const nextIdx = (idx + 1) % sequence.length;
                setActiveCell(sequence[nextIdx]);
                return;
            } else {
                if (isFirstInput) {
                    if (key === '00' || key === '000') values[activeKey] = '0';
                    else values[activeKey] = key;
                    isFirstInput = false;
                } else {
                    if (cur === '0') {
                        if (key !== '00' && key !== '000') values[activeKey] = key;
                    } else {
                        values[activeKey] += key;
                    }
                }
            }
            updateDisplay();
            calculate();
            saveState();
        }

        function handleBackspace() {
            let cur = values[activeKey];
            if (cur && cur.length > 1) {
                values[activeKey] = cur.slice(0, -1);
            } else {
                values[activeKey] = '0';
                isFirstInput = true;
            }
            updateDisplay();
            calculate();
            saveState();
        }

        window.addEventListener('keydown', (e) => {
            // モーダル表示中はEscapeで閉じる
            const zoomModal = document.getElementById('zoomModal');
            if (zoomModal && !zoomModal.classList.contains('hidden')) {
                if (e.key === 'Escape') closeZoomModal();
                return;
            }

            // テンキーおよびメインキーボードの数字 (0〜9)
            if (e.key >= '0' && e.key <= '9') {
                e.preventDefault();
                pressKey(e.key);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                pressKey('enter');
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                handleBackspace();
            } else if (e.key === 'Escape' || e.key === 'Delete') {
                e.preventDefault();
                pressKey('C');
            } else if (e.key === 'c' || e.key === 'C') {
                if (!e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    pressKey('C');
                }
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const idx = sequence.indexOf(activeKey);
                const nextIdx = e.shiftKey
                    ? (idx - 1 + sequence.length) % sequence.length
                    : (idx + 1) % sequence.length;
                setActiveCell(sequence[nextIdx]);
            }
        });

        function updateDisplay() {
            sequence.forEach(k => {
                const val = values[k];
                const num = parseFloat(val);
                const display = document.getElementById(`val-${k}`);
                if(display) display.innerText = isNaN(num) ? val : num.toLocaleString('en-US', {maximumFractionDigits: 4});
            });
        }

        function calculate() {
            const a = parseFloat(values.L1) || 0;
            const b = parseFloat(values.W) || 0;
            const c = parseFloat(values.L2) || 0;
            const interval = parseFloat(values.Pitch) || 0;

            if (b <= 0 || interval <= 0) {
                ['resNewB', 'resNewC', 'resIntervalCount', 'resStep'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.innerText = '-';
                });
                const tbody = document.getElementById('resultBody');
                if(tbody) tbody.innerHTML = '';
                return;
            }

            const count = Math.ceil(b / interval);
            const newB = count * interval;
            const slope = (c - a) / b;
            const newC = a + (slope * newB);
            const step = slope * interval;

            const resNewB = document.getElementById('resNewB');
            const resNewC = document.getElementById('resNewC');
            const resIntervalCount = document.getElementById('resIntervalCount');
            const resStep = document.getElementById('resStep');
            const tableSummary = document.getElementById('table-summary');

            if(resNewB) resNewB.innerText = Math.round(newB).toLocaleString();
            if(resNewC) resNewC.innerText = Math.round(newC).toLocaleString();
            if(resIntervalCount) resIntervalCount.innerText = count;
            if(resStep) resStep.innerText = Math.round(Math.abs(step)).toLocaleString();
            if(tableSummary) tableSummary.innerText = `${count}枚`;

            const tbody = document.getElementById('resultBody');
            if(tbody) {
                tbody.innerHTML = '';
                for (let i = 0; i <= count; i++) {
                    const dist = i * interval;
                    const height = a + (slope * dist);
                    const tr = document.createElement('tr');
                    
                    const distColor = i === 0 ? "text-[#8e8e93]" : "text-[#0a84ff]";
                    const heightColor = i === 0 ? "text-[#8e8e93]" : "text-[#30d158]";
                    
                    tr.innerHTML = `
                        <td class="text-[#ff9f0a] font-bold border border-[#333] py-2">${i}</td>
                        <td class="${distColor} border border-[#333] py-2">${dist.toLocaleString()}</td>
                        <td class="${heightColor} font-black text-xl border border-[#333] py-2">${Math.round(height).toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                }

                const scrapW = newB - b;
                const scrapL = newC - c;
                
                const trScrap = document.createElement('tr');
                trScrap.className = "bg-[#2c2c2e]";
                trScrap.innerHTML = `
                    <td class="text-[#d1d1d6] font-bold border border-[#333] py-2 text-[14px]" style="border-top: 1px solid #d1d1d6;">端材</td>
                    <td class="text-[#0a84ff] border border-[#333] py-2" style="border-top: 1px solid #d1d1d6;">
                        <div class="flex flex-col items-center justify-center gap-1">
                            <span class="text-[14px] text-[#d1d1d6] font-normal leading-none">働き 端材</span>
                            <span class="leading-none mt-0.5">${Math.round(scrapW).toLocaleString()}</span>
                        </div>
                    </td>
                    <td class="text-[#30d158] font-black text-xl border border-[#333] py-2" style="border-top: 1px solid #d1d1d6;">
                        <div class="flex flex-col items-center justify-center gap-1">
                            <span class="text-[14px] text-[#d1d1d6] font-normal leading-none">長さ 端材</span>
                            <span class="leading-none mt-0.5">${Math.round(scrapL).toLocaleString()}</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(trScrap);
            }
            drawSlope(a, b, c, newB, newC, count, interval);
        }

        function drawSlope(a, origB, origC, newB, newC, count, interval) {
            const canvas = document.getElementById('slopeCanvas');
            if(!canvas) return;
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, rect.width, rect.height);
            
            const padding = { l: 30, r: 30, t: 35, b: 35 };
            const drawW = rect.width - (padding.l + padding.r);
            const drawH = rect.height - (padding.t + padding.b);
            const scaleX = drawW / (newB || 1);
            const maxHeight = Math.max(a, newC, origC);
            const scaleY = drawH / (maxHeight || 1);

            const tx = (x) => padding.l + x * scaleX;
            const ty = (y) => rect.height - padding.b - y * scaleY;

            ctx.beginPath(); ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
            for(let j=0; j<=maxHeight; j+=maxHeight/4) {
                if(j === 0) continue;
                ctx.moveTo(tx(0), ty(j)); ctx.lineTo(tx(newB), ty(j));
            }
            ctx.stroke();

            ctx.beginPath(); ctx.strokeStyle = '#0a84ff'; ctx.lineWidth = 2;
            ctx.moveTo(tx(0), ty(0)); ctx.lineTo(tx(newB), ty(0)); ctx.stroke();

            for (let i = 1; i < count; i++) {
                const cx = i * interval;
                const cy = a + ((newC - a) / newB) * cx;
                ctx.beginPath();
                ctx.strokeStyle = '#bf5af2';
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.5;
                ctx.moveTo(tx(cx), ty(0)); ctx.lineTo(tx(cx), ty(cy)); ctx.stroke();
                ctx.globalAlpha = 1.0;
            }

            if (origB > 0 && origB !== newB) {
                ctx.setLineDash([4, 2]); ctx.strokeStyle = '#ff453a'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(tx(origB), ty(0)); ctx.lineTo(tx(origB), ty(origC)); ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.font = "bold 11px sans-serif"; 
                ctx.fillStyle = "#ff453a";
                ctx.textAlign = "center";
                ctx.fillText(Math.round(origC), tx(origB), ty(0) + 16);
            }

            ctx.beginPath(); ctx.strokeStyle = '#30d158'; ctx.lineWidth = 2;
            ctx.moveTo(tx(0), ty(0)); ctx.lineTo(tx(0), ty(a)); ctx.stroke();

            ctx.beginPath(); ctx.strokeStyle = '#30d158'; ctx.lineWidth = 2;
            ctx.moveTo(tx(newB), ty(0)); ctx.lineTo(tx(newB), ty(newC)); ctx.stroke();

            ctx.beginPath(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
            ctx.moveTo(tx(0), ty(a)); ctx.lineTo(tx(newB), ty(newC)); ctx.stroke();
            
            ctx.font = "bold 11px sans-serif"; 
            ctx.fillStyle = "#30d158"; 
            ctx.textAlign = "center";
            ctx.fillText(Math.round(a), tx(0), ty(a) - 8);
            ctx.fillText(Math.round(newC), tx(newB), ty(newC) - 8);

            ctx.fillStyle = "#0a84ff";
            ctx.fillText(`W: ${Math.round(origB)}`, tx(origB / 2), ty(0) + 16);

            if (origB !== newB && newB > 0) {
                ctx.fillStyle = "#8e8e93";
                ctx.font = "bold 10px sans-serif"; 
                ctx.fillText(`全体幅: ${Math.round(newB)}`, tx(newB / 2), ty(0) + 28);
            }
        }

        function saveState() {
            localStorage.setItem('slope_calc_v_keypad', JSON.stringify(values));
        }

        function formatNumberText(value) {
            const num = parseFloat(value);
            return Number.isFinite(num) ? num.toLocaleString('en-US', { maximumFractionDigits: 4 }) : '0';
        }

        function getResultText(id) {
            const el = document.getElementById(id);
            return el ? el.innerText.trim() : '-';
        }

        function buildShareText() {
            const lines = [];
            lines.push('勾配 寸法計算');
            lines.push('');
            lines.push('【入力値】');
            lines.push(`基準側 L1: ${formatNumberText(values.L1)}`);
            lines.push(`延長側 L2: ${formatNumberText(values.L2)}`);
            lines.push(`全体の幅 W: ${formatNumberText(values.W)}`);
            lines.push(`働き幅 @: ${formatNumberText(values.Pitch)}`);
            lines.push('');
            lines.push('【計算結果】');
            lines.push(`延長後の幅: ${getResultText('resNewB')}`);
            lines.push(`延長後のL2: ${getResultText('resNewC')}`);
            lines.push(`総枚数: ${getResultText('resIntervalCount')}`);
            lines.push(`増分: ${getResultText('resStep')}`);
            lines.push('');
            lines.push('【寸法表】');

            const rows = Array.from(document.querySelectorAll('#resultBody tr'));
            if (rows.length === 0) {
                lines.push('データなし');
            } else {
                rows.forEach((row) => {
                    const cells = Array.from(row.querySelectorAll('td')).map(td => td.innerText.replace(/\n+/g, ' / ').replace(/\s+/g, ' ').trim());
                    if (cells.length >= 3) {
                        lines.push(`${cells[0]} | 働き幅: ${cells[1]} | 長さ: ${cells[2]}`);
                    }
                });
            }

            return lines.join('\n');
        }

        async function shareAllData() {
            const shareText = buildShareText();

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: '勾配 寸法計算',
                        text: shareText
                    });
                    return;
                } catch (error) {
                    if (error && error.name === 'AbortError') return;
                }
            }

            try {
                const dummy = document.createElement('textarea');
                dummy.value = shareText;
                document.body.appendChild(dummy);
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                showToast('寸法データをコピーしました');
            } catch (error) {
                showToast('コピーに失敗しました');
            }
        }

        // ズームモーダル
        let zoomState = { scale: 1, x: 0, y: 0, rotation: 0 };
        let pinchState = { isDragging: false, startX: 0, startY: 0, initialDist: 0, initialScale: 1 };

        function openZoomModal() {
            const canvas = document.getElementById('slopeCanvas');
            if (!canvas || canvas.width === 0) return;

            const zoomImg = document.getElementById('zoomImg');
            zoomImg.src = canvas.toDataURL('image/png');
            
            zoomState = { scale: 1, x: 0, y: 0, rotation: 0 };
            updateZoomTransform();

            const modal = document.getElementById('zoomModal');
            modal.classList.remove('hidden');
        }

        function closeZoomModal() {
            const modal = document.getElementById('zoomModal');
            modal.classList.add('hidden');
            const zoomImg = document.getElementById('zoomImg');
            zoomImg.src = '';
        }

        function toggleZoomRotation() {
            const zoomImg = document.getElementById('zoomImg');
            zoomState.rotation = (zoomState.rotation === 0) ? 90 : 0;
            zoomState.x = 0;
            zoomState.y = 0;
            
            if (zoomState.rotation === 90) {
                const vW = window.innerWidth;
                const vH = window.innerHeight;
                const rect = zoomImg.getBoundingClientRect();
                const scaleW = (vW * 0.95) / rect.height;
                const scaleH = (vH * 0.95) / rect.width;
                zoomState.scale = Math.min(scaleW, scaleH);
            } else {
                zoomState.scale = 1;
            }
            
            zoomImg.style.transition = 'transform 0.3s ease-in-out';
            updateZoomTransform();
            setTimeout(() => { zoomImg.style.transition = 'none'; }, 300);
        }

        function updateZoomTransform() {
            const zoomImg = document.getElementById('zoomImg');
            zoomImg.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale}) rotate(${zoomState.rotation}deg)`;
        }

        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem('slope_calc_v_keypad'));
            if(saved) {
                values = saved;
                updateDisplay();
                calculate();
            }
            window.addEventListener('resize', calculate);
        };
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((registration) => {
                    console.log('ServiceWorker registration successful:', registration.scope);
                }).catch((err) => {
                    console.error('ServiceWorker registration failed:', err);
                });
            });
        }
    </script>
